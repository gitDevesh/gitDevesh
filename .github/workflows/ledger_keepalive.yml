name: Keep Ledger Agent Warm

on:
  push:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping ledger agent
        run: |
          curl --fail --silent --show-error --max-time 20 https://ledger-agent-production-1b1c.up.railway.app/health
