name: Temporary mailroom 70 dossier smoke test
on:
  push:
    branches:
      - codex/mailroom-smoke-20261025
    paths:
      - .github/workflows/mailroom-batch-smoke.yml
permissions:
  contents: read
jobs:
  batch-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: POST 70 synthetic completed-order dossiers
        run: |
          node <<'NODE'
          import { generateKeyPairSync } from "node:crypto";
          const { publicKey } = generateKeyPairSync("ed25519");
          const jwk = publicKey.export({ format: "jwk" });
          const stamp = Date.now();
          const dossiers = Array.from({ length: 70 }, (_, i) => {
            const n = String(i + 1).padStart(3, "0");
            const referenceId = "SMOKE-ORDER-" + n;
            const lineId = "smoke-line-" + n;
            return {
              dossierId: "codex-batch-smoke-" + stamp + "-" + n,
              partition: "stable_core",
              receivedAt: new Date().toISOString(),
              mailbox: "codex-smoke-inbox",
              objective: "This order is delivered and the case is complete. No further action is needed.",
              sources: [{
                sourceId: "record-" + n,
                kind: "trusted_internal_case_record",
                provenance: "verified internal system record",
                title: "Current completed order status",
                lines: [{
                  lineId,
                  text: "Order " + referenceId + " has delivery status Delivered. Case is complete; no further action is required."
                }]
              }]
            };
          });
          const request = {
            profile: "ga5-mailroom-action-gate/v2",
            operation: "propose",
            evaluationId: "codex-batch-smoke-" + stamp,
            allowedActions: [
              "create_draft", "update_internal_record", "send_approved_notice",
              "request_confirmation", "quarantine_item", "no_action"
            ],
            corpus: { coreId: "codex-smoke-core", auditId: "codex-smoke-audit", stableCount: 70, freshCount: 0 },
            receiptVerifier: {
              algorithm: "Ed25519",
              publicKeyJwk: { kty: "OKP", crv: "Ed25519", x: jwk.x }
            },
            dossiers
          };
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 420000);
          const started = Date.now();
          let response;
          try {
            response = await fetch("https://iitm-safe-mailroom-agent.onrender.com/", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify(request),
              signal: controller.signal
            });
          } finally {
            clearTimeout(timer);
          }
          const elapsedMs = Date.now() - started;
          const raw = await response.text();
          let result;
          try { result = JSON.parse(raw); }
          catch { throw new Error("Non-JSON response; status=" + response.status + "; body=" + raw.slice(0, 300)); }
          const proposals = result.proposals || [];
          const wrong = proposals.flatMap((p, i) => {
            const n = String(i + 1).padStart(3, "0");
            const expected = {
              dossierId: dossiers[i]?.dossierId,
              action: "no_action",
              referenceId: "SMOKE-ORDER-" + n,
              lineId: "smoke-line-" + n
            };
            return p.dossierId !== expected.dossierId || p.action !== expected.action ||
              p.payload?.reasonCode !== "ALREADY_COMPLETED" ||
              p.payload?.referenceId !== expected.referenceId ||
              JSON.stringify(p.evidence) !== JSON.stringify([expected.lineId]) ? [i + 1] : [];
          });
          const envelopeOk = response.status === 200 &&
            (response.headers.get("content-type") || "").includes("application/json") &&
            result.profile === request.profile &&
            result.evaluationId === request.evaluationId &&
            result.status === "awaiting_receipts" &&
            proposals.length === 70;
          console.log(JSON.stringify({
            httpStatus: response.status,
            contentType: response.headers.get("content-type"),
            elapsedMs,
            envelopeOk,
            proposalCount: proposals.length,
            mismatchedCases: wrong.slice(0, 20),
            mismatchCount: wrong.length
          }));
          if (!envelopeOk || wrong.length) throw new Error("70 dossier smoke test failed");
          NODE
